seed_everything: 42

model:
  class_path: models.lightning.ClassConditionalFlowMatchingModule
  init_args:
    unet_cfg:
      in_channels: 3
      base_channels: 64
      mult: 2.0
      n_layers: 3
      d_trunk: 32
      d_concat: 8
      group_norm_size: 8
      d_time: 128
      max_time_period: 10000.0
      activation_name: silu
      upsample_mode: nearest
    optim_cfg:
      name: adamw
      lr: 0.0003
      weight_decay: 0.0001
    n_classes: 10
    d_cls_emb: 128
    null_id: 10
    p_drop: 0.2

data:
  class_path: utils.data_modules.CIFAR10DataModule
  init_args:
    batch_size: 128
    data_path: data
    num_workers: 4
    transform: default
    shuffle: true

trainer:
  default_root_dir: outputs/cifar10_cond
  max_epochs: 20
  log_every_n_steps: 50
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: Flow Matching CIFAR10 Conditional
      run_name: cifar10_cond
      tracking_uri: file:mlruns
      save_dir: outputs/mlflow
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: outputs/cifar10_cond/checkpoints
        filename: best
        monitor: val_mse_epoch
        mode: min
        save_top_k: 1
        save_last: true
        auto_insert_metric_name: false
    - class_path: models.lightning.FlowMatchingSampleCallback
      init_args:
        every_n_epochs: 5
        n_images: 100
        nrow: 10
        n_steps: 50
        guidance_scale: 1.0
        ode_solver_name: euler_solver
        sample_seed: 42
        artifact_prefix: samples/cifar10_cond
    - class_path: models.lightning.InputGridCallback
      init_args:
        n_images: 64
        nrow: 8
        artifact_prefix: inputs/cifar10_cond
    - class_path: models.lightning.MLFlowArtifactCallback
      init_args:
        model_artifact_name: ClassCondUNet
