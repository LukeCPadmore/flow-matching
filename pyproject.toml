[project]
name = "flow-matching"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonargparse[signatures]>=4.27.7",
    "lightning>=2.6.5",
    "matplotlib>=3.10.9",
    "mlflow>=3.13.0",
    "optuna>=4.9.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "onnxruntime"
]

[build-system]
requires = ["uv_build >= 0.11.21, <0.12.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "flow_matching"
module-root = "src"